import org.apache.tools.ant.taskdefs.condition.Os

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '31.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '36')
        if (findProperty('android.kotlinVersion')) {
            kotlinVersion = findProperty('android.kotlinVersion')
        }
        frescoVersion = findProperty('expo.frescoVersion') ?: '2.5.0'

        if (System.properties['os.arch'] == 'aarch64') {
            // For M1 Users we need to use the NDK 24 which added support for aarch64
            // Use a more compatible NDK version
            ndkVersion = '23.1.7779620'
        } else {
            // Otherwise we default to the side-by-side NDK version from AGP.
            ndkVersion = '23.1.7779620'
        }
    }
    repositories {
        google()
        mavenCentral()
        // React Native maven repository for gradle plugin
        maven {
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
    }
    dependencies {
        // Updated to AGP 8.0.2 for React Native 0.72+ and Kommunicate SDK 2.14.5 compatibility
        classpath('com.android.tools.build:gradle:8.0.2')
        classpath('de.undercouch:gradle-download-task:5.0.1')
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json')"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven {
            url 'https://kommunicate.jfrog.io/artifactory/kommunicate-android-sdk'
        }
    }
}

// React Native 0.72+ uses react-android instead of react-native
// Map react-native to react-android for backward compatibility
allprojects {
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                // Substitute react-native with version to react-android
                substitute module("com.facebook.react:react-native") using module("com.facebook.react:react-android:0.72.6")
                // Also handle cases where react-android is requested without version
                substitute module("com.facebook.react:react-android") using module("com.facebook.react:react-android:0.72.6")
            }
        }
    }
}

// AGP 8.0+ requires namespace for all modules - auto-configure for subprojects
subprojects {
    // Apply Kotlin JVM target early, before other configurations
    afterEvaluate { project ->
        // Force Java 17 for all Kotlin compilation tasks
        project.tasks.matching { task ->
            task.getClass().name.contains('KotlinCompile')
        }.configureEach { task ->
            if (task.hasProperty('kotlinOptions')) {
                task.kotlinOptions.jvmTarget = "17"
            }
        }
    }
    
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // Enable buildConfig for AGP 8.0+ compatibility
                buildFeatures {
                    buildConfig true
                }
                
                // Ensure consistent Java version across all modules
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                
                if (namespace == null) {
                    // Try to get namespace from AndroidManifest
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (!manifestFile.exists()) {
                        manifestFile = project.file("AndroidManifest.xml")
                    }
                    if (manifestFile.exists()) {
                        try {
                            def manifest = new XmlParser().parse(manifestFile)
                            def packageName = manifest.@package
                            if (packageName) {
                                namespace = packageName
                            }
                        } catch (Exception e) {
                            // If parsing fails, use a default namespace based on project name
                            namespace = "com.${project.name.replace('-', '.').replace('_', '.')}"
                        }
                    } else {
                        // No manifest found, use default namespace
                        namespace = "com.${project.name.replace('-', '.').replace('_', '.')}"
                    }
                }
            }
        }
        
        // Force Java 17 for all Java compilation tasks
        project.tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
    }
}
